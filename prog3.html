<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="script.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .form-input-rounded {
            border-radius: 0.5rem;
        }
        .dark-mode {
            background-color: #1a202c;
            color: white;
        }
        #char-count {
            font-size: 0.9rem;
            color: gray;
        }
    </style>
</head>
<body class="bg-gradient-to-r from-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white rounded-xl shadow-2xl p-8">
        <h2 class="text-3xl font-extrabold text-center text-gray-900 mb-8">Get in Touch</h2>
        <p class="text-center text-gray-600 mb-4">We'd love to hear from you!</p>
        <button id="theme-toggle" class="bg-indigo-600 text-white px-4 py-2 rounded-lg mb-4">Toggle Dark Mode</button>

        <form id="contact-form" action="#" method="POST" class="space-y-6">
            <div>
                <label for="full-name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="full-name" name="full-name" required class="w-full px-4 py-2 border form-input-rounded">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-2 border form-input-rounded">
            </div>

            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Phone Number</label>
                <input type="tel" id="phone" name="phone" required class="w-full px-4 py-2 border form-input-rounded">
            </div>

            <div>
                <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                <input type="text" id="subject" name="subject" required class="w-full px-4 py-2 border form-input-rounded">
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Your Message</label>
                <textarea id="message" name="message" rows="5" required class="w-full px-4 py-2 border form-input-rounded"></textarea>
                <p id="char-count">Characters: 0</p>
            </div>

            <div>
                <label for="captcha" class="block text-sm font-medium text-gray-700 mb-1">CAPTCHA: What is 3 + 2?</label>
                <input type="text" id="captcha" name="captcha" required class="w-full px-4 py-2 border form-input-rounded">
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-indigo-600 text-white rounded-md">Send Message</button>
        </form>
        <p id="success-message" class="hidden text-green-600 text-center mt-4">Message Sent Successfully!</p>
    </div>

    <script>
        document.getElementById("theme-toggle").addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });

        document.getElementById("message").addEventListener("input", (event) => {
            document.getElementById("char-count").textContent = "Characters: " + event.target.value.length;
        });

        document.getElementById("contact-form").addEventListener("submit", (event) => {
            event.preventDefault();
            if (document.getElementById("captcha").value === "5") {
                document.getElementById("success-message").classList.remove("hidden");
            } else {
                alert("Incorrect CAPTCHA!");
            }
        });
    </script>
</body>
</html>
