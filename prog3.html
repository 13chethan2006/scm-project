<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom focus styles for inputs */
        input:focus, textarea:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.5); /* Tailwind indigo-500 with opacity */
            border-color: #6366F1; /* Tailwind indigo-600 */
        }
        /* Ensure all form elements have rounded corners */
        .form-input-rounded {
            border-radius: 0.5rem; /* Equivalent to Tailwind's rounded-lg */
        }
    </style>
</head>
<body class="bg-gradient-to-r from-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white rounded-xl shadow-2xl p-8 md:p-10 lg:p-12">
        <h2 class="text-3xl font-extrabold text-center text-gray-900 mb-8">Get in Touch</h2>
        <p class="text-center text-gray-600 mb-8">
            We'd love to hear from you! Please fill out the form below and we'll get back to you as soon as possible.
        </p>

        <form action="#" method="POST" class="space-y-6">
            <div>
                <label for="full-name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="full-name" name="full-name" autocomplete="name" required
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 form-input-rounded shadow-sm placeholder-gray-400 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       placeholder="John Doe">
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email" autocomplete="email" required
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 form-input-rounded shadow-sm placeholder-gray-400 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       placeholder="you@example.com">
            </div>

            <div>
                <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                <input type="text" id="subject" name="subject" required
                       class="mt-1 block w-full px-4 py-2 border border-gray-300 form-input-rounded shadow-sm placeholder-gray-400 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                       placeholder="Regarding your service...">
            </div>

            <div>
                <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Your Message</label>
                <textarea id="message" name="message" rows="5" required
                          class="mt-1 block w-full px-4 py-2 border border-gray-300 form-input-rounded shadow-sm placeholder-gray-400 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                          placeholder="Type your message here..."></textarea>
            </div>

            <div class="flex items-center">
                <input id="terms-agreement" name="terms-agreement" type="checkbox" required
                       class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                <label for="terms-agreement" class="ml-2 block text-sm text-gray-900">
                    I agree to the <a href="#" class="text-indigo-600 hover:text-indigo-800">Privacy Policy</a>
                </label>
            </div>

            <div>
                <button type="submit"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-lg font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors duration-200">
                    Send Message
                </button>
            </div>
        </form>
    </div>
</body>
</html>
