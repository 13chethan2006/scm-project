<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Hero Section with Features</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .rounded-element {
      border-radius: 0.5rem;
    }
    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-fade-in-down {
      animation: fadeInDown 0.6s ease forwards;
    }
    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease forwards;
    }
    .delay-200 {
      animation-delay: 0.2s;
    }
    /* Gradient animation on hero box background */
    .animated-bg {
      background: linear-gradient(270deg, #667eea, #764ba2, #6b46c1);
      background-size: 600% 600%;
      animation: gradientShift 15s ease infinite;
    }
    /* Scroll down indicator styles */
    .scroll-indicator {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 30px;
      border-bottom: 3px solid #5a67d8;
      border-right: 3px solid #5a67d8;
      transform-origin: center;
      animation: bounce 2s infinite;
      cursor: pointer;
    }
    .scroll-indicator.rotate {
      transform: translateX(-50%) rotate(45deg);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4 relative">
  <div
    class="max-w-4xl mx-auto bg-white rounded-xl shadow-2xl p-8 md:p-12 lg:p-16 text-center transform hover:scale-105 transition-transform duration-300 ease-in-out animated-bg relative"
  >
    <h1 class="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-gray-900 leading-tight mb-6 animate-fade-in-down">
      Unlock Your Potential with Our <span class="text-indigo-600">Innovative Solutions</span>
    </h1>

    <p class="text-lg sm:text-xl text-gray-600 mb-8 max-w-2xl mx-auto animate-fade-in-up">
      Discover a new way to achieve your goals with our cutting-edge technology and unparalleled support. We are dedicated to your success.
    </p>

    <div class="flex flex-col sm:flex-row justify-center items-center gap-4 animate-fade-in-up delay-200">
      <a href="#learn-more" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all duration-300 ease-in-out transform hover:-translate-y-1 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50">
        Learn More
      </a>
      <a href="#contact-us" class="bg-white border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 hover:text-indigo-700 font-bold py-3 px-8 rounded-full shadow-lg transition-all duration-300 ease-in-out transform hover:-translate-y-1 hover:scale-105 focus:outline-none focus:ring-4 focus:ring-indigo-500 focus:ring-opacity-50">
        Contact Us
      </a>
    </div>

    <p class="text-sm text-gray-500 mt-8">
      *No credit card required for initial exploration. Terms and conditions apply.
    </p>

    <!-- Scroll down indicator -->
    <div class="scroll-indicator rotate" title="Scroll down"></div>
  </div>
</body>
</html>
